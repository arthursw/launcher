[project]
name = "wetlands-launcher"
version = "0.3.8"
description = "Auto-updating application launcher with Python environment management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "keyring>=24.0",
    "packaging>=24.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "toml>=0.10",
    "typing-extensions>=4.0",
    "wetlands>=2.3.3",
]

[dependency-groups]
dev = [
    "pillow>=11.0",
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-cov>=4.0",
]

[project.optional-dependencies]
qt = [
    "PySide6>=6.0",
]
textual = [
    "textual>=0.40",
]

[project.scripts]
launcher = "launcher.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 130

[tool.hatch.build.targets.wheel]
packages = ["launcher"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.claude",
    "/.vscode",
    "/.worktrees",
    "/dist",
]

[tool.hatch.build.targets.wheel.force-include]
"assets/launcher.svg" = "assets/launcher.svg"
"assets/launcher.png" = "assets/launcher.png"
"assets/app.icns" = "assets/app.icns"
